name: Generate Goldens

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-06

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.4.350.0
          optional_components: com.lunarg.vulkan.vma
          install_runtime: true
          cache: true
          stripdown: true

          # We install our own pinned Lavapipe below.
          install_swiftshader: false
          install_lavapipe: false

      - name: Install pinned Lavapipe 26.1.5
        shell: pwsh
        run: |
          $url = "https://github.com/jakoch/rasterizers/releases/download/20260730/lavapipe-x64-26.1.5.zip"
          $zip = "$env:RUNNER_TEMP\lavapipe.zip"
          $dest = "C:\lavapipe"

          Write-Host "Downloading Lavapipe..."
          Invoke-WebRequest -Uri $url -OutFile $zip

          Write-Host "Extracting Lavapipe..."
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          Write-Host "=== Lavapipe files ==="
          Get-ChildItem $dest -Recurse

      - name: Register pinned Lavapipe
        shell: pwsh
        run: |
          $icd = Get-ChildItem C:\lavapipe -Recurse `
            -Filter "lvp_icd.x86_64.json" |
            Select-Object -First 1

          if (-not $icd) {
            throw "Could not find lvp_icd.x86_64.json"
          }

          $icdPath = $icd.FullName

          Write-Host "Registering Vulkan ICD:"
          Write-Host $icdPath

          New-Item `
            -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" `
            -Force | Out-Null

          New-ItemProperty `
            -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" `
            -Name $icdPath `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          "LAVAPIPE_ICD=$icdPath" >> $env:GITHUB_ENV

      - name: Verify Vulkan
        shell: pwsh
        run: |
          Write-Host "=== Runner ==="
          Write-Host "ImageOS=$env:ImageOS"
          Write-Host "ImageVersion=$env:ImageVersion"

          Write-Host "=== Odin ==="
          odin version

          Write-Host "=== Lavapipe ==="

          $icd = $env:LAVAPIPE_ICD

          if (-not (Test-Path $icd)) {
            throw "Missing Lavapipe ICD: $icd"
          }

          Write-Host "ICD:"
          Write-Host $icd
          Get-Content $icd

          $icdDir = Split-Path $icd
          $dll = Join-Path $icdDir "..\..\..\bin\vulkan_lvp.dll"
          $dll = [System.IO.Path]::GetFullPath($dll)

          if (-not (Test-Path $dll)) {
            throw "Missing Lavapipe DLL: $dll"
          }

          Write-Host "Driver DLL:"
          Write-Host $dll

          Write-Host "=== Registered Vulkan drivers ==="
          Get-ItemProperty `
            "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"

          Write-Host "=== Vulkan SDK ==="
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"

          $vulkanInfo = Join-Path `
            $env:VULKAN_SDK `
            "Bin\vulkaninfoSDK.exe"

          if (-not (Test-Path $vulkanInfo)) {
            Write-Host "Could not find expected vulkaninfoSDK.exe."
            Write-Host "Searching Vulkan SDK..."

            Get-ChildItem `
              $env:VULKAN_SDK `
              -Recurse `
              -Filter "*vulkaninfo*"

            throw "Could not find vulkaninfoSDK.exe"
          }

          Write-Host "=== Vulkan ==="
          & $vulkanInfo --summary

          Write-Host "=== Vulkan driver ==="
          & $vulkanInfo |
            Select-String `
              'deviceName|driverName|driverInfo|driverVersion|apiVersion'

      - name: Run Tests
        shell: pwsh
        run: |
          odin run build -- tests_gen_local_goldens_gh_actions

      - name: Upload golden images
        uses: actions/upload-artifact@v4
        with:
          name: golden-images
          path: tests/goldens_local/
          if-no-files-found: error