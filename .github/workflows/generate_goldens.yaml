name: Generate Goldens

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-06

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.4.350.0
          optional_components: com.lunarg.vulkan.vma
          install_runtime: true
          cache: true
          stripdown: true

          # We install our own pinned Lavapipe below.
          install_swiftshader: false
          install_lavapipe: false

      - name: Install pinned Lavapipe 26.1.5
        shell: pwsh
        run: |
          $url = "https://github.com/jakoch/rasterizers/releases/download/20260730/lavapipe-x64-26.1.5.zip"
          $zip = "$env:RUNNER_TEMP\lavapipe.zip"
          $dest = "C:\lavapipe"

          Write-Host "Downloading Lavapipe..."
          Invoke-WebRequest -Uri $url -OutFile $zip

          Write-Host "Extracting Lavapipe..."
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force

      - name: Register pinned Lavapipe
        shell: pwsh
        run: |
          $icd = Get-ChildItem C:\lavapipe -Recurse `
            -Filter "lvp_icd.x86_64.json" |
            Select-Object -First 1

          if (-not $icd) {
            throw "Could not find lvp_icd.x86_64.json"
          }

          $icdPath = $icd.FullName

          New-Item `
            -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" `
            -Force | Out-Null

          New-ItemProperty `
            -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" `
            -Name $icdPath `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          "LAVAPIPE_ICD=$icdPath" >> $env:GITHUB_ENV

      - name: Locate validation layers
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"

          $validation = Get-ChildItem $env:VULKAN_SDK -Recurse `
            -Filter "VK_LAYER_KHRONOS_validation.json" |
            Select-Object -First 1

          if (-not $validation) {
            Write-Host "Validation layer manifest not found."
            Write-Host "Searching SDK for layer files..."

            Get-ChildItem $env:VULKAN_SDK -Recurse `
              -Filter "*validation*"

            throw "VK_LAYER_KHRONOS_validation.json was not installed"
          }

          $layerPath = Split-Path $validation.FullName

          Write-Host "Validation layer manifest:"
          Write-Host $validation.FullName

          Write-Host "VK_LAYER_PATH=$layerPath"

          "VK_LAYER_PATH=$layerPath" >> $env:GITHUB_ENV

      - name: Verify Vulkan
        shell: pwsh
        run: |
          Write-Host "=== Runner ==="
          Write-Host "ImageOS=$env:ImageOS"
          Write-Host "ImageVersion=$env:ImageVersion"

          Write-Host "=== Odin ==="
          odin version

          Write-Host "=== Vulkan SDK ==="
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          Write-Host "VK_LAYER_PATH=$env:VK_LAYER_PATH"

          Write-Host "=== Validation layer ==="
          Get-ChildItem $env:VK_LAYER_PATH

          $vulkanInfo = Join-Path `
            $env:VULKAN_SDK `
            "Bin\vulkaninfoSDK.exe"

          if (-not (Test-Path $vulkanInfo)) {
            throw "Could not find vulkaninfoSDK.exe"
          }

          Write-Host "=== Vulkan summary ==="
          & $vulkanInfo --summary

          Write-Host "=== Vulkan driver ==="
          & $vulkanInfo |
            Select-String `
              'deviceName|driverName|driverInfo|driverVersion|apiVersion'

          Write-Host "=== Vulkan layers ==="
          & $vulkanInfo |
            Select-String `
              'VK_LAYER_KHRONOS_validation'

      - name: Run Tests
        shell: pwsh
        env:
          VK_LAYER_PATH: ${{ env.VK_LAYER_PATH }}
        run: |
          odin run build -- tests_gen_local_goldens_gh_actions

      - name: Upload golden images
        uses: actions/upload-artifact@v4
        with:
          name: golden-images
          path: tests/goldens_local/
          if-no-files-found: error