name: Generate Goldens

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4.3.1

      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          release: dev-2026-06

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: 1.4.350.0
          optional_components: com.lunarg.vulkan.vma
          install_runtime: true
          cache: true
          stripdown: true

          # Lavapipe is installed manually below so its version is pinned.
          install_swiftshader: false
          install_lavapipe: false

      - name: Install pinned Lavapipe 26.1.5
        shell: pwsh
        run: |
          $url = "https://github.com/jakoch/rasterizers/releases/download/20260730/lavapipe-x64-26.1.5.zip"
          $zip = "$env:RUNNER_TEMP\lavapipe.zip"
          $dest = "C:\lavapipe"

          Write-Host "Downloading pinned Lavapipe..."
          Invoke-WebRequest -Uri $url -OutFile $zip

          Write-Host "Extracting Lavapipe..."
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force

          Write-Host "=== Lavapipe files ==="
          Get-ChildItem $dest -Recurse

      - name: Register pinned Lavapipe
        shell: pwsh
        run: |
          $icd = Get-ChildItem C:\lavapipe -Recurse `
            -Filter "lvp_icd.x86_64.json" |
            Select-Object -First 1

          if (-not $icd) {
            throw "Could not find lvp_icd.x86_64.json"
          }

          $icdPath = $icd.FullName

          Write-Host "Registering Lavapipe ICD:"
          Write-Host $icdPath

          New-Item `
            -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" `
            -Force | Out-Null

          New-ItemProperty `
            -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" `
            -Name $icdPath `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          "LAVAPIPE_ICD=$icdPath" >> $env:GITHUB_ENV

      - name: Register Vulkan validation layer
        shell: pwsh
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"

          $validation = Get-ChildItem $env:VULKAN_SDK -Recurse `
            -Filter "VkLayer_khronos_validation.json" |
            Select-Object -First 1

          if (-not $validation) {
            throw "VkLayer_khronos_validation.json was not installed"
          }

          $manifest = $validation.FullName
          $layerDir = Split-Path $manifest
          $dll = Join-Path $layerDir "VkLayer_khronos_validation.dll"

          if (-not (Test-Path $dll)) {
            throw "Validation layer DLL was not found: $dll"
          }

          Write-Host "Registering validation layer:"
          Write-Host $manifest

          Write-Host "Validation DLL:"
          Write-Host $dll

          New-Item `
            -Path "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers" `
            -Force | Out-Null

          New-ItemProperty `
            -Path "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers" `
            -Name $manifest `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          "VALIDATION_LAYER_MANIFEST=$manifest" >> $env:GITHUB_ENV

      - name: Verify Vulkan
        shell: pwsh
        run: |
          Write-Host "=== Runner ==="
          Write-Host "ImageOS=$env:ImageOS"
          Write-Host "ImageVersion=$env:ImageVersion"

          Write-Host ""
          Write-Host "=== Odin ==="
          odin version

          Write-Host ""
          Write-Host "=== Vulkan SDK ==="
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"

          Write-Host ""
          Write-Host "=== Lavapipe ICD ==="
          Write-Host $env:LAVAPIPE_ICD
          Get-Content $env:LAVAPIPE_ICD

          $icdDir = Split-Path $env:LAVAPIPE_ICD
          $lavapipeDll = Join-Path `
            $icdDir `
            "..\..\..\bin\vulkan_lvp.dll"

          $lavapipeDll = [System.IO.Path]::GetFullPath($lavapipeDll)

          if (-not (Test-Path $lavapipeDll)) {
            throw "Missing Lavapipe DLL: $lavapipeDll"
          }

          Write-Host "Lavapipe DLL:"
          Write-Host $lavapipeDll

          Write-Host ""
          Write-Host "=== Validation layer ==="
          Write-Host $env:VALIDATION_LAYER_MANIFEST
          Get-Content $env:VALIDATION_LAYER_MANIFEST

          Write-Host ""
          Write-Host "=== Registered Vulkan drivers ==="
          Get-ItemProperty `
            "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers"

          Write-Host ""
          Write-Host "=== Registered Vulkan explicit layers ==="
          Get-ItemProperty `
            "HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers"

          Write-Host ""
          Write-Host "=== VulkanInfo ==="

          $vulkanInfo = Join-Path `
            $env:VULKAN_SDK `
            "Bin\vulkaninfoSDK.exe"

          if (-not (Test-Path $vulkanInfo)) {
            Write-Host "Searching for vulkaninfo..."
            Get-ChildItem `
              $env:VULKAN_SDK `
              -Recurse `
              -Filter "*vulkaninfo*"

            throw "Could not find vulkaninfoSDK.exe"
          }

          & $vulkanInfo --summary

          Write-Host ""
          Write-Host "=== Vulkan driver ==="

          & $vulkanInfo |
            Select-String `
              'deviceName|driverName|driverInfo|driverVersion|apiVersion'

          Write-Host ""
          Write-Host "=== Vulkan validation layer ==="

          $layerOutput = & $vulkanInfo |
            Select-String 'VK_LAYER_KHRONOS_validation'

          if (-not $layerOutput) {
            throw "VK_LAYER_KHRONOS_validation is not visible to Vulkan"
          }

          $layerOutput

      - name: Run Tests
        shell: pwsh
        run: |
          odin run build -- tests_gen_local_goldens_gh_actions

      - name: Upload golden images
        uses: actions/upload-artifact@v4
        with:
          name: golden-images
          path: tests/goldens_local/
          if-no-files-found: error